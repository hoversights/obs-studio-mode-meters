[workspace]
members = ["crates/core"]

[package]
name = "obs-studio-mode-meters"
version = "0.1.0"
edition = "2021"
publish = false
# Loaded into OBS Studio's process and calls libobs, so it is bound by
# OBS's own licence.
license = "GPL-2.0-or-later"
description = "OBS Studio plugin: per-source audio metering that distinguishes Program from Preview in Studio Mode, over obs-websocket."
repository = "https://github.com/hoversights/obs-studio-mode-meters"

[lib]
name = "obs_studio_mode_meters"
crate-type = ["cdylib"]

# NOTE: path scrubbing for released binaries is NOT configured here.
# `[profile.release] trim-paths` would be the natural home for it, but it
# is still unstable in the pinned Cargo (1.95.0) and fails the build
# outright. The packaging scripts set `--remap-path-prefix` instead, which
# is stable — see scripts/package-macos.sh.

# The metering engine, now a local crate. It used to be a git dependency on
# `hoversights/framesw-obs-plugin`, pinned to rev a32dcac; that was always
# temporary, and cutting it was the condition for publishing. A plugin
# strangers load into their own OBS should not need a commercial product's
# repository in order to build, or move on its release schedule.
#
# See crates/core/src/lib.rs for the drift warning that replaces it.
[dependencies]
studio-mode-meters-core = { path = "crates/core" }
